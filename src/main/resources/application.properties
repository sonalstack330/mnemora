# --- Database connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/mnemora_db
spring.datasource.username=postgres
spring.datasource.password=root

# --- JPA / Hibernate config ---
# 'update' means Hibernate auto-creates/updates tables based on your Java entities.
# Good for development. Never usage 'update' in production (use migrations like Flyway instead).
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate runs, in your console — useful while learning/debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate which SQL dialect to speak (PostgreSQL-specific syntax)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server config --
server.port=8080

# Gemini API key, pulled from environment variable (never hardcoded)
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent